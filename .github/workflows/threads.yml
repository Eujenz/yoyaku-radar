name: Post to Threads

# Two slots a day (Taiwan time ~12:00 and ~20:00). GitHub often starts scheduled runs late or skips
# them, so each slot has a backup run; the script posts each queue entry at most once.
on:
  schedule:
    - cron: '7 4 * * *'   # 12:07 Taiwan, am slot
    - cron: '41 5 * * *'  # 13:41 Taiwan, am backup
    - cron: '7 12 * * *'  # 20:07 Taiwan, pm slot
    - cron: '41 13 * * *' # 21:41 Taiwan, pm backup
    - cron: '23 2 * * 1'  # Monday: refresh the long-lived token
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the post without publishing'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: threads
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      SITE_URL: ${{ vars.SITE_URL || 'https://yoyaku.fans' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh token
        if: github.event.schedule == '23 2 * * 1'
        env:
          NEW_TOKEN_FILE: ${{ runner.temp }}/new-threads-token
        run: node scripts/threads_post.mjs --refresh

      # Storing a new token needs a fine-grained PAT with "Secrets: write" on this repo, saved as THREADS_SECRETS_PAT.
      # Without it, a changed token fails the run so the owner hears about it before the old one expires.
      - name: Store refreshed token
        if: github.event.schedule == '23 2 * * 1'
        env:
          GH_TOKEN: ${{ secrets.THREADS_SECRETS_PAT }}
          NEW_TOKEN_FILE: ${{ runner.temp }}/new-threads-token
        run: |
          [ -s "$NEW_TOKEN_FILE" ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "Threads returned a new token but THREADS_SECRETS_PAT is not set; update the THREADS_TOKEN secret by hand." >&2
            exit 1
          fi
          gh secret set THREADS_TOKEN --repo "$GITHUB_REPOSITORY" < "$NEW_TOKEN_FILE"

      - name: Post the due queue entry
        if: github.event.schedule != '23 2 * * 1'
        run: node scripts/threads_post.mjs

      - name: Save the posting record
        if: github.event.schedule != '23 2 * * 1' && env.DRY_RUN != '1'
        run: |
          git diff --quiet social/posted.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/posted.json
          git commit -m "Record Threads post [skip ci]"
          for i in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          exit 1

      - name: Open or update an issue when the run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Threads 發文失敗"
          body="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
