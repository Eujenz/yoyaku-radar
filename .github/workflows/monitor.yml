name: Monitor live site

on:
  schedule:
    # Independent of the update workflow, so an outage is noticed even if deploys stop. GitHub may start runs late.
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Default SITE_URL to the custom domain
        if: env.SITE_URL == ''
        run: echo "SITE_URL=https://yoyaku.fans" >> "$GITHUB_ENV"

      - name: Probe the live site
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/monitor.mjs | tee report.txt

      - name: Open or update an issue when the site is unhealthy
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="網站異常"
          body="$(cat report.txt)

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
